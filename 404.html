<!doctype HTML >
<html lang="en">
   <head>
      <title>404</title>
   </head>
   <body>
     This is a 404 Not Found page... but possible not for long! Some content may appear in a few seconds
     <script>
       const _404 = () => document.body.innerHTML += '<br>Ok nope it is actually a 404 page. Unlucky.';
       (async function() {
         const path = document.location.pathname.split('/');
         if (path.length < 4) {
           return _404();
         }
         const root = path.slice(0,3).join('/');
         const response = await fetch(root);
         if (response.statusCode === 404) {
           return _404();
         }
         document.write(await response.text());
       })();
     </script>
   </body>
</html>
